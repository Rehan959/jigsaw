[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jigsaw"
# Static version instead of a dynamic version so we can get better layer caching while building docker, check the docker file to understand
version = "0.5"
description = "Jigsaw is an undetectable, powerful, flexible, high-performance Python framework that makes Web Scraping easy and effortless as it should be!"
readme = {file = "README.md", content-type = "text/markdown"}
keywords = [
    "web-scraping",
    "scraping",
    "automation",
    "browser-automation",
    "data-extraction",
    "html-parsing",
    "undetectable",
    "playwright",
    "selenium-alternative",
    "web-crawler",
    "browser",
    "crawling",
    "headless",
    "scraper",
    "chrome",
]
requires-python = ">=3.10"
classifiers = [
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    # "Development Status :: 5 - Production/Stable",
    # "Development Status :: 6 - Mature",
    # "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Text Processing :: Markup",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
dependencies = [
    "lxml>=6.1.1",
    "cssselect>=1.5.0",
    "orjson>=3.11.8",
    "tld>=0.13.2",
    "w3lib>=2.4.1",
    "typing_extensions"
]

[project.optional-dependencies]
fetchers = [
    "click>=8.3.0",
    "curl_cffi>=0.16.1",
    "playwright>=1.62.0",
    "patchright>=1.62.1",
    "browserforge>=1.2.4",
    "apify-fingerprint-datapoints>=0.15.0",
    "msgspec>=0.21.1",
    "anyio>=4.14.0",
    "protego>=0.6.2",
]
rag = [
    "markdownify>=1.2.0",
    "jigsaw[fetchers]",
]
ai = [
    "mcp>=2.0.0",
    "markdownify>=1.2.0",
    "jigsaw[fetchers]",
]
shell = [
    "IPython>=8.37",  # The last version that supports Python 3.10
    "markdownify>=1.2.0",
    "jigsaw[fetchers]",
]
all = [
    "jigsaw[ai,shell]",
]


[project.scripts]
jigsaw = "jigsaw.cli:main"
jigsaw-mcp = "jigsaw.cli:mcp"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["jigsaw*"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["jigsaw"]
ignore = ["tests", "benchmarks.py"]
